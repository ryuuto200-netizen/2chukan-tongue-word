<meta charset="utf-8">

<title>現代評論用語｜2学期中間</title>
<style>
:root{color-scheme:light;--ink:#263342;--border:#d8dfe8;--red:#eed0d0;--blue:#cce4f1}
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:16px;line-height:1.75}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}h1{font-size:1.35rem;line-height:1.5;margin:0 0 4px;font-weight:700}.instructions{margin:0;color:#536171;font-size:.875rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 16px}.control{border:1px solid #b4bcc8;border-radius:7px;padding:10px 16px;min-height:44px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}.control.word{background:var(--red)}.control.meaning{background:var(--blue)}
.table{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:white}.row{display:grid;grid-template-columns:48px minmax(0,30%) minmax(0,1fr);border-top:1px solid var(--border)}.row:first-child{border-top:0}.header{background:#edf1f6;font-weight:600;font-size:.875rem}.header>div{padding:10px 12px}.row>div+div{border-left:1px solid var(--border)}.number{padding:14px 6px;color:#5a6675;text-align:center;font-size:.875rem;align-self:stretch;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}.cell{display:flex;min-width:0}.sheet{display:block;width:100%;min-height:60px;position:relative;border:0;background:transparent;color:inherit;font:inherit;line-height:1.8;text-align:left;padding:12px 14px;overflow-wrap:anywhere;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.word .sheet{font-weight:600}.sheet[aria-pressed="true"] .text{visibility:hidden}.word .sheet[aria-pressed="true"]{background:var(--red)}.meaning .sheet[aria-pressed="true"]{background:var(--blue)}.hint{display:none;font-size:.875rem;font-weight:400;position:absolute;inset:0;align-items:center;justify-content:center;color:#4c5865}.sheet[aria-pressed="true"] .hint{display:flex}.sheet:focus-visible,.control:focus-visible{outline:3px solid #326ca6;outline-offset:-3px}.note{font-size:.875rem;color:#617083;margin:14px 0 0}
@media(max-width:520px){main{padding:18px 10px 36px}.row{grid-template-columns:38px minmax(0,32%) minmax(0,1fr)}.sheet{padding:11px 10px}.header>div{padding:9px 7px}.toolbar{gap:8px}.control{padding:9px 12px}.hint{font-size:.8rem}}@media print{body{background:white}main{max-width:none;padding:0}.toolbar,.instructions,.note,.hint{display:none!important}.sheet[aria-pressed="true"]{background:transparent!important}.sheet[aria-pressed="true"] .text{visibility:visible}.row{break-inside:avoid}}
</style>

<body><main>
<h1>現代評論用語</h1>
<p class="instructions">語・意味をタップで隠す／表示。まとめて隠すときは下のボタン。</p>
<div class="toolbar" aria-label="列全体のシート操作">
<button type="button" class="control word" data-column="word" aria-pressed="false">語を全部隠す</button>
<button type="button" class="control meaning" data-column="meaning" aria-pressed="false">意味を全部隠す</button>
</div>
<div class="table" role="table" aria-label="現代評論用語の語と意味">
<div class="row header" role="row"><div role="columnheader">ID</div><div role="columnheader">語</div><div role="columnheader">意味</div></div>
<div role="row" class="row"><div role="cell" class="number">136</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="136 ロマン主義の語を隠す"><span class="text">ロマン主義</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="136 ロマン主義の意味を隠す"><span class="text">十八世紀末から十九世紀前半にかけて起こった、個人の感情や感性を重視する文学・芸術上の運動。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">136</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="136 ロマンティシズムの語を隠す"><span class="text">ロマンティシズム</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="136 ロマンティシズムの意味を隠す"><span class="text">十八世紀末から十九世紀前半にかけて起こった、個人の感情や感性を重視する文学・芸術上の運動。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">137</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="137 産業革命の語を隠す"><span class="text">産業革命</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="137 産業革命の意味を隠す"><span class="text">十八世紀後半のヨーロッパから始まる、産業社会を到来させた技術革新。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">138</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="138 全体主義の語を隠す"><span class="text">全体主義</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="138 全体主義の意味を隠す"><span class="text">個人の自由や権利よりも国家の利益を優先させる考え方。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">139</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="139 アナキズムの語を隠す"><span class="text">アナキズム</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="139 アナキズムの意味を隠す"><span class="text">国家や力などの一切の社会的権力を否定して、個人の自由や独立を重視する考え方。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">140</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="140 時間・空間の均質化の語を隠す"><span class="text">時間・空間の均質化</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="140 時間・空間の均質化の意味を隠す"><span class="text">時間や空間が、客観的に測定可能なものとなること。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">141</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="141 大衆社会の語を隠す"><span class="text">大衆社会</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="141 大衆社会の意味を隠す"><span class="text">大多数の普通の人々の集団が、大きな力を持つ社会。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">142</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="142 消費社会の語を隠す"><span class="text">消費社会</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="142 消費社会の意味を隠す"><span class="text">大量のモノやサービスを消費する、高度に発達した資本主義社会。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">143</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="143 情報（化）社会の語を隠す"><span class="text">情報（化）社会</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="143 情報（化）社会の意味を隠す"><span class="text">生活・経済が情報を中心として発達していく社会。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">144</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="144 監視社会の語を隠す"><span class="text">監視社会</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="144 監視社会の意味を隠す"><span class="text">権力をもつ組織などに、人々が常に監視されている社会。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">145</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="145 システムの語を隠す"><span class="text">システム</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="145 システムの意味を隠す"><span class="text">個々の要素が影響し合いながら、全体として機能するまとまりや仕組み。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">146</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="146 装置の語を隠す"><span class="text">装置</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="146 装置の意味を隠す"><span class="text">ある目的に沿って、機械・設備などを設けること。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">147</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="147 リスクの語を隠す"><span class="text">リスク</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="147 リスクの意味を隠す"><span class="text">ある行動や選択を行う際に発生し得る危険。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">148</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="148 グローバル化の語を隠す"><span class="text">グローバル化</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="148 グローバル化の意味を隠す"><span class="text">物事が世界的・地球的になっていく動き。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">148</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="148 グローバリゼーションの語を隠す"><span class="text">グローバリゼーション</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="148 グローバリゼーションの意味を隠す"><span class="text">物事が世界的・地球的になっていく動き。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">149</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="149 エコロジーの語を隠す"><span class="text">エコロジー</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="149 エコロジーの意味を隠す"><span class="text">自然と人間との共生を目指し、自然環境を保護しようとする考え方。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">150</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="150 多様性の語を隠す"><span class="text">多様性</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="150 多様性の意味を隠す"><span class="text">性質の異なるものが多く存在している様子。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">151</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="151 構造主義の語を隠す"><span class="text">構造主義</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="151 構造主義の意味を隠す"><span class="text">人間の社会や文化を支えている根底的な構造を研究しようとする立場。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">152</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="152 アカデミズムの語を隠す"><span class="text">アカデミズム</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="152 アカデミズムの意味を隠す"><span class="text">学問研究や芸術創作において、純粋に真理や美を追求する態度。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">153</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="153 ジャーナリズムの語を隠す"><span class="text">ジャーナリズム</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="153 ジャーナリズムの意味を隠す"><span class="text">マス・メディアによる、時事的な問題の報道・解説・批判などの活動。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">154</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="154 マジョリティーの語を隠す"><span class="text">マジョリティー</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="154 マジョリティーの意味を隠す"><span class="text">多数。過半数。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">155</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="155 マイノリティーの語を隠す"><span class="text">マイノリティー</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="155 マイノリティーの意味を隠す"><span class="text">少数。少数派。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">156</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="156 フェミニズムの語を隠す"><span class="text">フェミニズム</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="156 フェミニズムの意味を隠す"><span class="text">女性の社会的権利を男性と同等にし、女性の能力や役割の発展を目指す主張および、その運動。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">157</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="157 ジェンダーの語を隠す"><span class="text">ジェンダー</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="157 ジェンダーの意味を隠す"><span class="text">社会的・文化的に形成される、男らしさや女らしさ。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">158</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="158 ポストモダンの語を隠す"><span class="text">ポストモダン</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="158 ポストモダンの意味を隠す"><span class="text">近代を乗り越えようとする思想運動。脱近代。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">159</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="159 自己決定の語を隠す"><span class="text">自己決定</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="159 自己決定の意味を隠す"><span class="text">自分の問題について、権力や社会の圧力を受けずに自分自身が決定すること。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
<div role="row" class="row"><div role="cell" class="number">160</div><div role="cell" class="cell word"><button type="button" class="sheet" data-side="word" aria-pressed="false" aria-label="160 自己責任の語を隠す"><span class="text">自己責任</span><span class="hint" aria-hidden="true">タップで表示</span></button></div><div role="cell" class="cell meaning"><button type="button" class="sheet" data-side="meaning" aria-pressed="false" aria-label="160 自己責任の意味を隠す"><span class="text">自分の言動の結果について、他人や社会ではなく、自分自身が責任を負うこと。</span><span class="hint" aria-hidden="true">タップで表示</span></button></div></div>
</div>
<p class="note">原本の順番・表記で27項目。136・148の重複番号も原本どおり。</p>
</main>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
function setCovered(button,covered){
 button.setAttribute('aria-pressed',String(covered));
 button.querySelector('.text').setAttribute('aria-hidden',String(covered));
 const row=button.closest('.row');
 const word=row.querySelector('.word .text').textContent;
 const side=button.dataset.side==='word'?'語':'意味';
 // 語のシートを隠しているときは読み上げでも語を明かさない。
 const prefix=button.dataset.side==='word'?row.querySelector('.number').textContent:row.querySelector('.number').textContent+'の';
 button.setAttribute('aria-label',prefix+' '+side+'を'+(covered?'表示':'隠す'));
}
function syncControls(){
 document.querySelectorAll('[data-column]').forEach(control=>{
  const allCovered=sheets.filter(b=>b.dataset.side===control.dataset.column).every(b=>b.getAttribute('aria-pressed')==='true');
  const label=control.dataset.column==='word'?'語':'意味';
  control.textContent=label+'を全部'+(allCovered?'表示':'隠す');
  control.setAttribute('aria-pressed',String(allCovered));
 });
}
sheets.forEach(button=>button.addEventListener('click',()=>{setCovered(button,button.getAttribute('aria-pressed')!=='true');syncControls()}));
document.querySelectorAll('[data-column]').forEach(control=>control.addEventListener('click',()=>{
 const selected=sheets.filter(b=>b.dataset.side===control.dataset.column);
 const covered=!selected.every(b=>b.getAttribute('aria-pressed')==='true');
 selected.forEach(b=>setCovered(b,covered));syncControls();
}));
